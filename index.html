<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍓 레시피 스크랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --cream:#FFF8F3;
  --card:#FFFFFF;
  --pink:#F27DA0;
  --pink-soft:#FFE3EC;
  --pink-deep:#D95F87;
  --butter:#FFF1C9;
  --mint:#DFF3E4;
  --brown:#5C4A42;
  --brown-soft:#9C8378;
  --line:#F3E4DA;
  --radius:20px;
  --shadow:0 4px 14px rgba(217,95,135,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Pretendard',-apple-system,sans-serif;
  background:var(--cream);
  background-image:radial-gradient(#F8E8DC 1.2px, transparent 1.2px);
  background-size:22px 22px;
  color:var(--brown);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
.jua{font-family:'Jua',sans-serif;font-weight:400}

/* ───── 헤더 ───── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,248,243,.92);
  backdrop-filter:blur(8px);
  border-bottom:2px dashed var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-size:24px;color:var(--pink-deep);display:flex;align-items:center;gap:6px}
.nick-chip{
  background:var(--pink-soft);border:none;border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--pink-deep);
  cursor:pointer;font-family:inherit;
}

/* ───── 검색 ───── */
.search-wrap{padding:14px 18px 4px;max-width:640px;margin:0 auto}
.search{
  width:100%;border:2px solid var(--line);border-radius:999px;
  padding:11px 18px;font-size:15px;font-family:inherit;
  background:var(--card);color:var(--brown);outline:none;
}
.search:focus{border-color:var(--pink)}
.search::placeholder{color:#C9B5AB}

/* ───── 카드 그리드 ───── */
main{max-width:640px;margin:0 auto;padding:10px 18px 30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding-top:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  position:relative;background:var(--card);
  border-radius:14px;box-shadow:var(--shadow);
  padding:26px 14px 14px;cursor:pointer;
  border:1.5px solid var(--line);
  transition:transform .15s;
}
.card:nth-child(odd){transform:rotate(-1.3deg)}
.card:nth-child(even){transform:rotate(1.1deg)}
.card:active{transform:scale(.96) rotate(0deg)}
.tape{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:64px;height:20px;border-radius:3px;
  background:repeating-linear-gradient(45deg,rgba(242,125,160,.45) 0 6px,rgba(255,227,236,.55) 6px 12px);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.card:nth-child(3n) .tape{background:repeating-linear-gradient(45deg,rgba(255,209,102,.5) 0 6px,rgba(255,241,201,.6) 6px 12px)}
.card:nth-child(3n+1) .tape{background:repeating-linear-gradient(45deg,rgba(134,197,160,.45) 0 6px,rgba(223,243,228,.6) 6px 12px)}
.card .emoji{font-size:34px;text-align:center;display:block;margin-bottom:8px}
.card h3{font-size:15px;line-height:1.35;text-align:center;word-break:keep-all;margin-bottom:8px}
.card .meta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink-deep);font-weight:600}
.badge.gray{background:#F4EDE8;color:var(--brown-soft)}
.badge.lock{background:var(--butter);color:#B08A2E}

.empty{
  text-align:center;padding:70px 20px;color:var(--brown-soft);
}
.empty .big{font-size:52px;margin-bottom:14px}
.empty p{font-size:15px;line-height:1.6}

/* ───── 탭바 ───── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-top:2px dashed var(--line);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  max-width:100%;
}
.tab{
  flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--brown-soft);font-weight:600;padding:4px 0;
}
.tab .ico{font-size:22px;filter:grayscale(.7);opacity:.65;transition:.15s}
.tab.on{color:var(--pink-deep)}
.tab.on .ico{filter:none;opacity:1;transform:scale(1.12)}
.tab.add-tab .ico{
  background:var(--pink);color:#fff;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  filter:none;opacity:1;box-shadow:0 4px 10px rgba(242,125,160,.4);
  margin-top:-18px;
}

/* ───── 시트(모달) ───── */
.sheet-bg{
  position:fixed;inset:0;background:rgba(92,74,66,.35);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-bg.show{display:flex}
.sheet{
  background:var(--cream);width:100%;max-width:640px;
  border-radius:26px 26px 0 0;
  max-height:88vh;max-height:88dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 20px calc(28px + env(safe-area-inset-bottom));
  animation:up .25s ease;
}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.handle{width:44px;height:5px;border-radius:99px;background:#E5D5CB;margin:6px auto 16px}
.sheet h2{font-size:22px;color:var(--pink-deep);text-align:center;margin-bottom:4px;word-break:keep-all}
.sheet .sub{text-align:center;font-size:13px;color:var(--brown-soft);margin-bottom:18px}

/* 상세 보기 */
.src-link{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;
  background:var(--mint);color:#3E7D5C;padding:6px 13px;border-radius:999px;
  text-decoration:none;font-weight:600;margin:0 auto 16px;justify-content:center;
}
.center{display:flex;justify-content:center}
.sec-title{
  font-size:16px;color:var(--pink-deep);margin:20px 0 10px;
  display:flex;align-items:center;gap:6px;
}
.ing-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ing-list li{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:9px 10px;font-size:13.5px;line-height:1.35;
  display:flex;align-items:center;gap:8px;cursor:pointer;word-break:keep-all;
}
.ing-list li .chk{
  width:18px;height:18px;border-radius:6px;border:2px solid var(--pink);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;transition:.12s;
}
.ing-list li.done .chk{background:var(--pink)}
.ing-list li.done span{text-decoration:line-through;color:#C9B5AB}
.step-list{list-style:none;counter-reset:st}
.step-list li{
  counter-increment:st;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px 12px 46px;margin-bottom:8px;
  font-size:14.5px;line-height:1.55;position:relative;word-break:keep-all;
}
.step-list li::before{
  content:counter(st);position:absolute;left:12px;top:11px;
  width:24px;height:24px;border-radius:50%;background:var(--pink-soft);
  color:var(--pink-deep);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;font-family:'Jua';
}
.memo-box{background:var(--butter);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;word-break:keep-all}
.recipe-box{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:16px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;
}
.detail-actions{display:flex;gap:10px;margin-top:22px}

/* ───── 버튼/폼 ───── */
.btn{
  flex:1;border:none;border-radius:999px;padding:14px;font-size:15.5px;
  font-family:'Jua';cursor:pointer;transition:.12s;
}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(242,125,160,.35)}
.btn.ghost{background:var(--card);color:var(--brown-soft);border:2px solid var(--line)}
.btn.danger{background:#FDEBEB;color:#D66;flex:0 0 auto;padding:14px 20px}
.btn:disabled{opacity:.5}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--pink-deep);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:2px solid var(--line);border-radius:14px;
  padding:11px 14px;font-size:15px;font-family:inherit;color:var(--brown);
  background:var(--card);outline:none;resize:vertical;
}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.hint{font-size:12px;color:var(--brown-soft);margin-top:4px}

/* 업로드 */
.drop{
  border:2.5px dashed var(--pink);border-radius:var(--radius);
  background:var(--pink-soft);padding:34px 18px;text-align:center;
  cursor:pointer;margin-bottom:14px;
}
.drop .big{font-size:40px;margin-bottom:8px}
.drop p{font-size:14.5px;color:var(--pink-deep);font-weight:600;line-height:1.5}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.previews img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.or-line{text-align:center;font-size:13px;color:var(--brown-soft);margin:16px 0;position:relative}

/* 공개 토글 */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:16px;
}
.toggle-row .t-label{font-size:14.5px;font-weight:600}
.toggle-row .t-sub{font-size:12px;color:var(--brown-soft);margin-top:2px}
.switch{position:relative;width:52px;height:30px;flex-shrink:0}
.switch input{display:none}
.slider{
  position:absolute;inset:0;background:#E8DAD1;border-radius:99px;cursor:pointer;transition:.2s;
}
.slider::after{
  content:'🔒';position:absolute;left:3px;top:3px;width:24px;height:24px;
  background:#fff;border-radius:50%;transition:.2s;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.switch input:checked + .slider{background:var(--pink)}
.switch input:checked + .slider::after{transform:translateX(22px);content:'🌸'}

/* 로딩 */
.loading{
  text-align:center;padding:44px 20px;
}
.loading .spin{
  font-size:46px;display:inline-block;animation:bounce 1s infinite;
}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.loading p{margin-top:14px;font-size:15px;color:var(--pink-deep);font-weight:600}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  background:var(--brown);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="logo jua">🍓 레시피 스크랩</div>
  <button class="nick-chip" id="nickChip" onclick="askNickname()">닉네임</button>
</header>

<div class="search-wrap">
  <input class="search" id="searchInput" placeholder="🔍 음식 이름이나 재료로 찾아보기" oninput="render()">
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🧁</div>
    <p id="emptyMsg">아직 스크랩한 레시피가 없어요<br>캡쳐를 올려서 첫 레시피를 만들어봐요!</p>
  </div>
</main>

<nav>
  <button class="tab on" id="tabAll" onclick="setTab('all')"><span class="ico">🌸</span>모두의 레시피</button>
  <button class="tab add-tab" onclick="openAdd()"><span class="ico">＋</span>스크랩</button>
  <button class="tab" id="tabMine" onclick="setTab('mine')"><span class="ico">📖</span>내 레시피</button>
</nav>

<!-- 추가/편집 시트 -->
<div class="sheet-bg" id="addSheet">
  <div class="sheet">
    <div class="handle"></div>
    <div id="addBody"></div>
  </div>
</div>

<!-- 상세 시트 -->
<div class="sheet-bg" id="detailSheet">
  <div class="sheet">
    <div class="handle"></div>
    <div id="detailBody"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
window.onerror = function(msg, url, line, col, error) {
  document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#5C4A42;word-break:break-all;line-height:1.6"><h2>⚠️ 에러 발생</h2><p style="margin-top:10px"><b>메시지:</b> ' + msg + '</p><p><b>파일:</b> ' + url + '</p><p><b>줄:</b> ' + line + ', <b>칸:</b> ' + col + '</p></div>';
  return true;
};
</script>
<script src="config.js"></script>
<script>
/* ═══════════════════════════════════════════
   설정은 config.js 파일에! (이 파일은 건드릴 필요 없음)
═══════════════════════════════════════════ */
if (typeof RS_CONFIG === 'undefined') {
  document.body.innerHTML = '<div style="padding:60px 30px;text-align:center;font-family:sans-serif;color:#5C4A42"><div style="font-size:50px">🥲</div><h2>config.js 파일이 없어요</h2><p style="margin-top:10px;line-height:1.6">recipe.html과 같은 위치에<br>config.js를 올려주세요!</p></div>';
  throw new Error('config.js not found');
}
const firebaseConfig = RS_CONFIG.firebase;
const GAS_URL = RS_CONFIG.gasUrl;

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ───── 상태 ───── */
let recipes = {};        // id -> recipe
let tab = 'all';
let nickname = localStorage.getItem('rs_nickname') || '';
let editingId = null;    // 편집 중인 레시피 id
let pendingImages = [];  // {data(base64), mimeType}

/* ───── 닉네임 ───── */
function askNickname(force=true){
  const n = prompt('닉네임을 정해주세요! (내 레시피 구분용)', nickname);
  if(n && n.trim()){
    nickname = n.trim();
    localStorage.setItem('rs_nickname', nickname);
    updateNickChip(); render();
  } else if(!nickname && force){
    // 닉네임 없으면 기본값
  }
}
function updateNickChip(){
  document.getElementById('nickChip').textContent = nickname ? '🐰 ' + nickname : '닉네임 정하기';
}

/* ───── 데이터 구독 ───── */
db.ref('recipes').on('value', snap => {
  recipes = snap.val() || {};
  render();
});

/* ───── 탭 & 렌더 ───── */
function setTab(t){
  tab = t;
  document.getElementById('tabAll').classList.toggle('on', t==='all');
  document.getElementById('tabMine').classList.toggle('on', t==='mine');
  if(t==='mine' && !nickname) askNickname();
  render();
}

function render(){
  updateNickChip();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const list = Object.entries(recipes)
    .map(([id,r]) => ({id,...r}))
    .filter(r => tab==='mine' ? r.nickname===nickname : r.public)
    .filter(r => {
      if(!q) return true;
      const hay = (r.title+' '+(r.ingredients||[]).join(' ')+' '+(r.content||'')+' '+(r.nickname||'')).toLowerCase();
      return hay.includes(q);
    })
    .sort((a,b) => a.title.localeCompare(b.title,'ko') || (b.createdAt||0)-(a.createdAt||0));

  grid.innerHTML = list.map(r => `
    <div class="card" onclick="openDetail('${r.id}')">
      <div class="tape"></div>
      <span class="emoji">${r.emoji||'🍽️'}</span>
      <h3 class="jua">${esc(r.title)}</h3>
      <div class="meta">
        <span class="badge">${esc(r.nickname||'?')}</span>
        ${r.source && r.source!=='미상' ? `<span class="badge gray">${esc(r.source.length>10 ? r.source.slice(0,10)+'…' : r.source)}</span>` : ''}
        ${tab==='mine' && !r.public ? '<span class="badge lock">🔒 비공개</span>' : ''}
      </div>
    </div>`).join('');

  const empty = document.getElementById('empty');
  empty.style.display = list.length ? 'none' : 'block';
  document.getElementById('emptyMsg').innerHTML =
    q ? '앗, 검색 결과가 없어요 🥲' :
    tab==='mine' ? '아직 스크랩한 레시피가 없어요<br>아래 ＋ 버튼으로 캡쳐를 올려봐요!' :
    '아직 공개된 레시피가 없어요<br>첫 번째 레시피의 주인공이 되어봐요!';
}

/* ───── 추가 플로우 ───── */
function openAdd(){
  if(!nickname){ askNickname(); if(!nickname) return; }
  editingId = null;
  pendingImages = [];
  showUploadStep();
  document.getElementById('addSheet').classList.add('show');
  document.querySelector('#addSheet .sheet').scrollTop = 0;
}
function closeAdd(){ document.getElementById('addSheet').classList.remove('show'); }

function showUploadStep(){
  document.getElementById('addBody').innerHTML = `
    <h2 class="jua">🍓 레시피 스크랩하기</h2>
    <p class="sub">인스타나 웹에서 캡쳐한 레시피 사진을 올려주세요</p>
    <div class="drop" onclick="document.getElementById('fileInput').click()">
      <div class="big">📸</div>
      <p>여기를 눌러 캡쳐 올리기<br><span style="font-weight:400;font-size:12.5px">여러 장이면 최대 3장까지 한 번에!</span></p>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFiles(this.files)">
    <div class="previews" id="previews"></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" onclick="closeAdd()">닫기</button>
      <button class="btn pink" id="extractBtn" disabled onclick="extract()">✨ 레시피 뽑아내기</button>
    </div>
    <p class="or-line">─ 링크가 있다면 (인스타는 안 돼요!) ─</p>
    <div class="field" style="margin-bottom:10px">
      <input id="urlInput" placeholder="🔗 블로그/레시피 페이지 주소 붙여넣기" inputmode="url">
    </div>
    <div class="center"><button class="btn ghost" style="flex:0 0 auto;padding:12px 26px" onclick="extractUrl()">🔗 링크로 가져오기</button></div>
    <p class="or-line">─ 캡쳐 없이 직접 쓰고 싶다면 ─</p>
    <div class="center"><button class="btn ghost" style="flex:0 0 auto;padding:12px 26px" onclick="showForm()">✏️ 직접 입력하기</button></div>
  `;
}

async function handleFiles(files){
  pendingImages = [];
  const arr = Array.from(files).slice(0,3);
  for(const f of arr){
    const compressed = await compressImage(f);
    pendingImages.push(compressed);
  }
  document.getElementById('previews').innerHTML =
    pendingImages.map(p => `<img src="data:${p.mimeType};base64,${p.data}">`).join('');
  document.getElementById('extractBtn').disabled = pendingImages.length===0;
}

function compressImage(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      let {width:w, height:h} = img;
      if(Math.max(w,h) > MAX){ const s = MAX/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = c.toDataURL('image/jpeg', .82);
      res({ data: dataUrl.split(',')[1], mimeType:'image/jpeg' });
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  });
}

function extractUrl(){
  const url = document.getElementById('urlInput').value.trim();
  if(!url){ toast('링크를 먼저 붙여넣어 주세요!'); return; }
  if(!/^https?:\/\//.test(url)){ toast('http로 시작하는 전체 주소를 넣어주세요!'); return; }
  runExtract({ url });
}

async function extract(){
  runExtract({ images: pendingImages });
}

async function runExtract(payload){
  document.getElementById('addBody').innerHTML = `
    <div class="loading">
      <span class="spin">🍳</span>
      <p>레시피를 요리조리 읽는 중...<br><span style="font-size:12.5px;font-weight:400;color:var(--brown-soft)">10~20초 정도 걸려요</span></p>
    </div>`;
  try{
    if(!GAS_URL.startsWith('https://script.google.com')) throw new Error('GAS_URL이 설정되지 않았어요');
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // preflight 회피
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('서버 응답 오류 ' + res.status);
    const out = await res.json();
    if(out.error) throw new Error(out.error);
    if(!out.title) throw new Error('추출 결과가 비어있어요');
    showForm(out);
  }catch(e){
    toast('읽기 실패: ' + (e.message||e).toString().slice(0,60));
    setTimeout(()=>showForm(), 1800);
  }
}

/* ───── 입력/편집 폼 ───── */
function showForm(data={}, id=null){
  editingId = id;
  const r = id ? recipes[id] : {};
  const v = {
    title: data.title ?? r.title ?? '',
    emoji: data.emoji ?? r.emoji ?? '🍽️',
    source: data.source ?? r.source ?? '미상',
    ingredients: (data.ingredients ?? r.ingredients ?? []).join('\n'),
    // 예전 통짜 저장분(content)은 만드는 법 칸으로 불러옴
    steps: (data.steps ?? r.steps ?? (r.content ? r.content.split('\n') : [])).join('\n'),
    pub: id ? !!r.public : true,
  };
  document.getElementById('addBody').innerHTML = `
    <h2 class="jua">${id ? '✏️ 레시피 고치기' : '🧁 스크랩 확인하기'}</h2>
    <p class="sub">${id ? '' : 'AI가 읽은 내용이에요 — 틀린 곳은 고쳐주세요!'}</p>
    <div class="field"><label>이모지 & 음식 이름</label>
      <div style="display:flex;gap:8px">
        <input id="fEmoji" value="${esc(v.emoji)}" style="width:64px;text-align:center;font-size:20px">
        <input id="fTitle" value="${esc(v.title)}" placeholder="예) 크림 파스타">
      </div>
    </div>
    <div class="field"><label>출처</label>
      <input id="fSource" value="${esc(v.source)}" placeholder="안 보이면 '미상'">
    </div>
    <div class="field"><label>재료</label>
      <textarea id="fIng" rows="6" placeholder="한 줄에 하나씩!&#10;예)&#10;스파게티면 200g&#10;생크림 1컵">${esc(v.ingredients)}</textarea>
      <p class="hint">한 줄에 하나씩 — 보기 화면에서 체크리스트가 돼요</p>
    </div>
    <div class="field"><label>만드는 법</label>
      <textarea id="fSteps" rows="8" placeholder="한 줄에 한 단계씩!">${esc(v.steps)}</textarea>
      <p class="hint">한 줄에 한 단계씩 — 번호는 자동으로 붙어요</p>
    </div>
    <div class="toggle-row">
      <div><div class="t-label">🌸 모두에게 공개</div><div class="t-sub">끄면 나만 볼 수 있어요</div></div>
      <label class="switch"><input type="checkbox" id="fPub" ${v.pub?'checked':''}><span class="slider"></span></label>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" onclick="closeAdd()">닫기</button>
      <button class="btn pink" onclick="save()">💾 저장하기</button>
    </div>`;
  document.getElementById('addSheet').classList.add('show');
}

function save(){
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ toast('음식 이름을 적어주세요!'); return; }
  const rec = {
    nickname,
    title,
    emoji: document.getElementById('fEmoji').value.trim() || '🍽️',
    source: document.getElementById('fSource').value.trim() || '미상',
    ingredients: document.getElementById('fIng').value.split('\n').map(s=>s.trim()).filter(Boolean),
    steps: document.getElementById('fSteps').value.split('\n').map(s=>s.trim()).filter(Boolean),
    public: document.getElementById('fPub').checked,
    createdAt: editingId ? (recipes[editingId].createdAt||Date.now()) : Date.now(),
  };
  const ref = editingId ? db.ref('recipes/'+editingId) : db.ref('recipes').push();
  ref.set(rec).then(()=>{
    closeAdd();
    toast(editingId ? '고쳤어요! ✏️' : '스크랩 완료! 🍓');
    if(!editingId) setTab('mine');
  });
}

/* ───── 상세 ───── */
function openDetail(id){
  const r = recipes[id]; if(!r) return;
  const mine = r.nickname === nickname;
  document.getElementById('detailBody').innerHTML = `
    <div style="text-align:center;font-size:48px;margin-bottom:6px">${r.emoji||'🍽️'}</div>
    <h2 class="jua">${esc(r.title)}</h2>
    <p class="sub">by ${esc(r.nickname||'?')} ${r.public?'':' · 🔒 비공개'}</p>
    <div class="center"><span class="src-link">📌 ${esc(r.source||'미상')}</span></div>
    ${(r.ingredients||[]).length ? `
      <div class="sec-title jua">🧺 재료 <span style="font-size:12px;color:var(--brown-soft);font-family:Pretendard">눌러서 체크!</span></div>
      <ul class="ing-list">${r.ingredients.map(i=>`
        <li onclick="this.classList.toggle('done')"><span class="chk">✓</span><span>${esc(i)}</span></li>`).join('')}
      </ul>` : ''}
    ${(r.steps||[]).length ? `
      <div class="sec-title jua">🍳 만드는 법</div>
      <ol class="step-list">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    ${!((r.ingredients||[]).length) && !((r.steps||[]).length) && r.content ? `
      <div class="sec-title jua">🍳 레시피</div>
      <div class="recipe-box">${esc(r.content)}</div>` : ''}
    <div class="detail-actions">
      ${mine ? `
        <button class="btn danger" onclick="removeRecipe('${id}')">🗑️</button>
        <button class="btn ghost" onclick="closeDetail();showForm({},'${id}')">✏️ 고치기</button>` : ''}
      <button class="btn pink" onclick="closeDetail()">닫기</button>
    </div>`;
  document.getElementById('detailSheet').classList.add('show');
  document.querySelector('#detailSheet .sheet').scrollTop = 0;
}
function closeDetail(){ document.getElementById('detailSheet').classList.remove('show'); }

function removeRecipe(id){
  if(!confirm('이 레시피를 정말 지울까요?')) return;
  db.ref('recipes/'+id).remove().then(()=>{ closeDetail(); toast('지웠어요 👋'); });
}

/* ───── 유틸 ───── */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* 시트 바깥 누르면 닫기 */
document.getElementById('addSheet').addEventListener('click', e=>{ if(e.target.id==='addSheet') closeAdd(); });
document.getElementById('detailSheet').addEventListener('click', e=>{ if(e.target.id==='detailSheet') closeDetail(); });

/* 아래로 스와이프하면 닫기 */
function makeSwipeClose(bgId, closeFn){
  const bg = document.getElementById(bgId);
  const sheet = bg.querySelector('.sheet');
  let startY = 0, dragY = 0, dragging = false;

  sheet.addEventListener('touchstart', e=>{
    // 시트 내용이 맨 위로 스크롤된 상태에서만 끌기 시작
    if(sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    dragging = true; dragY = 0;
    sheet.style.transition = 'none';
  }, {passive:true});

  sheet.addEventListener('touchmove', e=>{
    if(!dragging) return;
    dragY = e.touches[0].clientY - startY;
    if(dragY > 0){
      sheet.style.transform = 'translateY(' + dragY + 'px)';
    }
  }, {passive:true});

  sheet.addEventListener('touchend', ()=>{
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .22s ease';
    if(dragY > 110){
      sheet.style.transform = 'translateY(100%)';
      setTimeout(()=>{ closeFn(); sheet.style.transform = ''; sheet.style.transition = ''; }, 200);
    } else {
      sheet.style.transform = '';
      setTimeout(()=>{ sheet.style.transition = ''; }, 250);
    }
  });
}
makeSwipeClose('addSheet', closeAdd);
makeSwipeClose('detailSheet', closeDetail);

updateNickChip();
if(!nickname) setTimeout(()=>askNickname(false), 600);
</script>
